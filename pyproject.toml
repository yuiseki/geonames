[project]
name = "geonames"
version = "0.1.0"
description = "GeoNames dumps kept by date, unchanged, with Parquet"
requires-python = ">=3.12"
dependencies = [
    # Versions before 1.5.5 have bugs in the spatial extension.
    "duckdb>=1.5.5",
    "huggingface-hub>=0.35",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
